worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 4002;
    server_name _;

    # OAuth popup flows need the opener relationship to remain available while
    # still isolating unrelated cross-origin browsing contexts.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    root /srv/mitos/www;
    index index.html;

    location /api/ {
      proxy_pass http://127.0.0.1:4003;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /socket.io/ {
      proxy_pass http://127.0.0.1:4003;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /cdn/ {
      proxy_pass http://127.0.0.1:4003;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # HTML entrypoints must always be revalidated. Keeping an old index.html
    # across a deploy can make the browser request hashed chunks that no longer exist.
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    location = /admin {
      return 301 /admin/;
    }

    location = /admin/index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    # Hashed Vite assets are immutable. Missing old-version chunks must return a
    # real 404 instead of the SPA index so the client can detect a stale deploy.
    location ^~ /chunks/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ^~ /entries/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location /admin/ {
      try_files $uri $uri/ /admin/index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
  }
}
