name: mitos-r2a-runtime

on:
  push:
    branches: [cert/mitos-r2-mercado-pago-runtime]
  workflow_dispatch:

jobs:
  mercado-pago-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      NODE_ENV: development
      BC_CI: "true"
      BC_HTTPS: "false"
      BC_DB_URI: mongodb://127.0.0.1:27017/bookcars?appName=bookcars
      BC_DB_SSL: "false"
      BC_DB_DEBUG: "false"
      BC_AUTH_COOKIE_DOMAIN: localhost
      BC_ADMIN_HOST: http://localhost:3001/
      BC_FRONTEND_HOST: http://localhost:3002/
      BC_JWT_EXPIRE_AT: "86400"
      BC_TOKEN_EXPIRE_AT: "86400"
      BC_EMAIL_ENABLED: "false"
      BC_EMAIL_PROVIDER: smtp
      BC_EMAIL_TIMEOUT_MS: "1000"
      BC_SMTP_HOST: localhost
      BC_SMTP_PORT: "2525"
      BC_SMTP_SECURE: "false"
      BC_SMTP_USER: ci
      BC_SMTP_PASS: ci
      BC_SMTP_FROM: "MITOS R2 CI <ci@example.test>"
      BC_CDN_ROOT: /tmp/mitos-r2/cdn
      BC_CDN_USERS: /tmp/mitos-r2/cdn/bookcars/users
      BC_CDN_TEMP_USERS: /tmp/mitos-r2/cdn/bookcars/temp/users
      BC_CDN_CARS: /tmp/mitos-r2/cdn/bookcars/cars
      BC_CDN_TEMP_CARS: /tmp/mitos-r2/cdn/bookcars/temp/cars
      BC_CDN_LOCATIONS: /tmp/mitos-r2/cdn/bookcars/locations
      BC_CDN_TEMP_LOCATIONS: /tmp/mitos-r2/cdn/bookcars/temp/locations
      BC_CDN_CONTRACTS: /tmp/mitos-r2/cdn/bookcars/contracts
      BC_CDN_TEMP_CONTRACTS: /tmp/mitos-r2/cdn/bookcars/temp/contracts
      BC_CDN_LICENSES: /tmp/mitos-r2/cdn/bookcars/licenses
      BC_CDN_TEMP_LICENSES: /tmp/mitos-r2/cdn/bookcars/temp/licenses
      BC_DEFAULT_LANGUAGE: es
      BC_BASE_CURRENCY: PEN
      BC_MERCADO_PAGO_CURRENCY: PEN
      BC_MERCADO_PAGO_ACCESS_TOKEN: R2-SIMULATED-NO-NETWORK
      BC_MERCADO_PAGO_PUBLIC_KEY: R2-SIMULATED-NO-NETWORK
      BC_MINIMUM_AGE: "21"
      BC_WEBSITE_NAME: MITOS RENT A CAR
      BC_TIMEZONE: America/Lima
      MITOS_ENABLE_DEV_SEED: "true"
      MITOS_ALLOW_SEED: "false"
      R2_EVIDENCE_DIR: /tmp/mitos-r2/evidence

    steps:
      - name: Checkout R2 certification branch
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Generate ephemeral R2 identities and secrets
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' 'AZ')"
          COOKIE_SECRET="$(openssl rand -hex 32)"
          JWT_SECRET="$(openssl rand -hex 32)"
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          CUSTOMER="r2-customer-${GITHUB_RUN_ID}@example.test"
          ADMIN="r2-admin-${GITHUB_RUN_ID}@example.test"
          SUPPLIER="r2-supplier-${GITHUB_RUN_ID}@example.test"

          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$COOKIE_SECRET"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"

          {
            echo "MITOS_DEMO_PASSWORD=$PASSWORD"
            echo "MITOS_DEMO_CUSTOMER_EMAIL=$CUSTOMER"
            echo "MITOS_DEMO_CUSTOMER_NAME=MITOS R2 Customer"
            echo "MITOS_DEMO_ADMIN_EMAIL=$ADMIN"
            echo "MITOS_DEMO_ADMIN_NAME=MITOS R2 Admin"
            echo "MITOS_DEMO_SUPPLIER_EMAIL=$SUPPLIER"
            echo "BC_ADMIN_EMAIL=$ADMIN"
            echo "BC_COOKIE_SECRET=$COOKIE_SECRET"
            echo "BC_JWT_SECRET=$JWT_SECRET"
            echo "BC_MERCADO_PAGO_WEBHOOK_SECRET=$WEBHOOK_SECRET"
          } >> "$GITHUB_ENV"

      - name: Wait for ephemeral Mongo
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Mongo did not become reachable" >&2
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --force

      - name: Build backend baseline
        working-directory: backend
        run: npm run build

      - name: Run existing lifecycle/payment security regressions
        working-directory: backend
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npx jest \
            __tests__/rentalLifecycleService.test.ts \
            __tests__/paymentStateService.test.ts \
            __tests__/mercadoPagoWebhook.test.ts \
            __tests__/transactionalEmailSemantics.test.ts \
            --runInBand --no-cache

      - name: Seed isolated MitoS R2 fixture
        working-directory: backend
        run: npm run seed:mitos:dev

      - name: Execute R2A provider-simulated runtime certification v2
        working-directory: backend
        run: npx tsx scripts/mitos-r2a-runtime-cert-v2.ts

      - name: Execute R2A concurrent double-payment gate
        working-directory: backend
        run: npx tsx scripts/mitos-r2a-concurrency-cert.ts

      - name: Execute R2A terminal retry release gate
        working-directory: backend
        run: npx tsx scripts/mitos-r2a-terminal-retry-cert.ts

      - name: Upload R2A evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitos-r2a-runtime-evidence-${{ github.run_id }}
          path: |
            /tmp/mitos-r2/evidence/mitos-r2a-runtime-v2.json
            /tmp/mitos-r2/evidence/mitos-r2a-concurrency.json
            /tmp/mitos-r2/evidence/mitos-r2a-terminal-retry.json
          if-no-files-found: warn
          retention-days: 14
